
name: Publicar Organiza+

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar projeto Flutter para web
        run: flutter create app --platforms web

      - name: Adicionar biblioteca de armazenamento
        run: cd app && flutter pub add shared_preferences

      - name: Copiar código do Organiza+
        run: cp main.dart app/lib/main.dart

      - name: Compilar aplicativo
        run: cd app && flutter build web --release --base-href "/organiza-mais/"

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
